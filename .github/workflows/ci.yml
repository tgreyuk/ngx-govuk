name: CI
on:
  push:
    paths:
      - 'projects/ngx-govuk/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'projects/ngx-govuk/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22']
    name: Node ${{ matrix.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lib:lint
      - name: Build
        run: npm run lib:build
      - name: Test
        run: npm run lib:test
