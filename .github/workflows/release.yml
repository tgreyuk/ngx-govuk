name: Release

# On every push to main, release-please opens or updates a release PR that
# bumps the version and changelog. Merging that PR tags the release, creates
# the GitHub Release and stages the library on npm for a maintainer to approve.
#
# To stage a release again after a failed publish, run this workflow by hand
# from main and give the release's tag, such as v0.6.0.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to stage, such as v0.6.0'
        required: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for a short-lived
      # publish credential, so no NPM_TOKEN secret is needed.
      id-token: write
    steps:
      # A manual run checks out the given tag, so it stages exactly what was
      # released, not whatever has reached main since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run lib:build
      # Stages the release rather than publishing it: it only goes live once a
      # maintainer approves it with 2FA on npmjs.com or via `npm stage approve`.
      # This step's OIDC token could publish, and install scripts run in this
      # job, so the human approval is what keeps a compromised dependency from
      # releasing a version. Trusted publishing needs npm 11.5.1 or later;
      # Node 22 ships npm 10. Only this step uses it, so installs stay on npm 10.
      - name: Stage for publishing
        run: npx -y npm@11 stage publish ./dist/ngx-govuk --access public
