name: Release

# On every push to main, release-please opens or updates a release PR that
# bumps the version and changelog. Merging that PR tags the release, creates
# the GitHub Release and publishes the library to npm.
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for a short-lived
      # publish credential, so no NPM_TOKEN secret is needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run lib:build
      # Publishes as soon as the release PR is merged, with provenance. Trusted
      # publishing needs npm 11.5.1 or later; Node 22 ships npm 10. Only this
      # step uses it, so installs stay on npm 10.
      - name: Publish
        run: npx -y npm@11 publish ./dist/ngx-govuk --access public
