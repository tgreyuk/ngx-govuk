<div
  class="govuk-form-group govuk-password-input"
  [class.govuk-form-group--error]="!!errorMessage()"
>
  @if (asPageHeading()) {
    <h1 class="govuk-label-wrapper">
      <label [attr.for]="fieldId()" [class]="labelClasses()">{{
        label()
      }}</label>
    </h1>
  } @else {
    <label [attr.for]="fieldId()" [class]="labelClasses()">{{ label() }}</label>
  }

  @if (hint()) {
    <div [id]="hintId()" class="govuk-hint">{{ hint() }}</div>
  }

  @if (errorMessage()) {
    <p [id]="errorId()" class="govuk-error-message">
      <span class="govuk-visually-hidden">Error:</span> {{ errorMessage() }}
    </p>
  }

  <div class="govuk-input__wrapper govuk-password-input__wrapper">
    <ng-content></ng-content>
    <!-- Added after the input, as GOV.UK Frontend's JavaScript does. -->
    <div
      class="govuk-password-input__sr-status govuk-visually-hidden"
      aria-live="polite"
    >
      {{ announcement() }}
    </div>
    <button
      type="button"
      class="govuk-button govuk-button--secondary govuk-password-input__toggle"
      [attr.aria-controls]="fieldId()"
      [attr.aria-label]="shown() ? 'Hide password' : 'Show password'"
      (click)="toggle()"
    >
      {{ shown() ? 'Hide' : 'Show' }}
    </button>
  </div>
</div>
