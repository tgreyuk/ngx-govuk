@if (asPageHeading()) {
  <h1 class="govuk-label-wrapper">
    <label [attr.for]="fieldId()" [class]="labelClasses()">{{ label() }}</label>
  </h1>
} @else {
  <label [attr.for]="fieldId()" [class]="labelClasses()">{{ label() }}</label>
}

@if (hint()) {
  <div [id]="hintId()" class="govuk-hint">{{ hint() }}</div>
}

<ng-content select="[ngxGovukErrorMessage]"></ng-content>

<div class="govuk-input__wrapper govuk-password-input__wrapper">
  <ng-content></ng-content>
  <!-- Added after the input, as GOV.UK Frontend's JavaScript does. Each
       text on one line, so it has no space at each end. -->
  <!-- prettier-ignore -->
  <div class="govuk-password-input__sr-status govuk-visually-hidden" aria-live="polite">{{ announcement() }}</div>
  <!-- prettier-ignore -->
  <button
    type="button"
    class="govuk-button govuk-button--secondary govuk-password-input__toggle"
    [attr.aria-controls]="fieldId()"
    [attr.aria-label]="shown() ? hidePasswordAriaLabelText() : showPasswordAriaLabelText()"
    (click)="toggle()"
  >{{ shown() ? hidePasswordText() : showPasswordText() }}</button>
</div>
