<div
  class="govuk-form-group"
  [class.govuk-form-group--error]="!!errorMessage()"
>
  @if (asPageHeading()) {
    <h1 class="govuk-label-wrapper">
      <label [attr.for]="fieldId()" [class]="labelClasses()">{{
        label()
      }}</label>
    </h1>
  } @else {
    <label [attr.for]="fieldId()" [class]="labelClasses()">{{ label() }}</label>
  }

  @if (hint()) {
    <div [attr.id]="hintId()" class="govuk-hint">{{ hint() }}</div>
  }

  @if (errorMessage()) {
    <p [attr.id]="errorId()" class="govuk-error-message">
      <span class="govuk-visually-hidden">Error:</span> {{ errorMessage() }}
    </p>
  }

  <!-- GOV.UK Frontend only adds the wrapper when there is a prefix or suffix.
       Angular allows one default ng-content, so it is captured here once. -->
  <ng-template #control><ng-content></ng-content></ng-template>

  @if (prefix() || suffix()) {
    <div class="govuk-input__wrapper">
      @if (prefix()) {
        <div class="govuk-input__prefix" aria-hidden="true">
          {{ prefix() }}
        </div>
      }
      <ng-container [ngTemplateOutlet]="control"></ng-container>
      @if (suffix()) {
        <div class="govuk-input__suffix" aria-hidden="true">
          {{ suffix() }}
        </div>
      }
    </div>
  } @else {
    <ng-container [ngTemplateOutlet]="control"></ng-container>
  }
</div>
