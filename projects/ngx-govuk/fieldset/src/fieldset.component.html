<fieldset
  class="govuk-fieldset"
  [attr.role]="role() || null"
  [attr.aria-describedby]="describedBy() || null"
>
  <legend [class]="legendClasses()">
    @if (asPageHeading()) {
      <h1 class="govuk-fieldset__heading">{{ legend() }}</h1>
    } @else {
      <ng-container>{{ legend() }}</ng-container>
    }
  </legend>
  <ng-content></ng-content>
</fieldset>
