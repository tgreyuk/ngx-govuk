<div
  class="govuk-form-group"
  [class.govuk-form-group--error]="!!errorMessage()"
>
  <fieldset
    class="govuk-fieldset"
    role="group"
    [attr.aria-describedby]="describedBy()"
  >
    <legend [class]="legendClasses()">
      @if (asPageHeading()) {
        <h1 class="govuk-fieldset__heading">{{ legend() }}</h1>
      } @else {
        {{ legend() }}
      }
    </legend>

    @if (hint()) {
      <div [id]="hintId()" class="govuk-hint">{{ hint() }}</div>
    }

    @if (errorMessage()) {
      <p [id]="errorId()" class="govuk-error-message">
        <span class="govuk-visually-hidden">Error:</span> {{ errorMessage() }}
      </p>
    }

    <div class="govuk-date-input" [id]="baseName()">
      @for (part of parts; track part.key) {
        <div class="govuk-date-input__item">
          <div class="govuk-form-group">
            <label
              class="govuk-label govuk-date-input__label"
              [for]="baseName() + '-' + part.key"
            >
              {{ part.label }}
            </label>
            <input
              [class]="inputClasses(part)"
              [id]="baseName() + '-' + part.key"
              [name]="baseName() + '-' + part.key"
              type="text"
              inputmode="numeric"
              [attr.autocomplete]="dateOfBirth() ? 'bday-' + part.key : null"
              [value]="value()[part.key]"
              [disabled]="disabled()"
              (input)="update(part.key, $event)"
              (blur)="onTouched()"
            />
          </div>
        </div>
      }
    </div>
  </fieldset>
</div>
