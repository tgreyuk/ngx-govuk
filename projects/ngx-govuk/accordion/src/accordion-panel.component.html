<div class="govuk-accordion__section-header">
  <h2 class="govuk-accordion__section-heading">
    <button
      type="button"
      class="govuk-accordion__section-button"
      [attr.aria-controls]="contentId"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="ariaLabel()"
      (click)="toggle()"
    >
      <span class="govuk-accordion__section-heading-text" [attr.id]="headingId"
        ><span class="govuk-accordion__section-heading-text-focus">{{
          heading()
        }}</span></span
      ><span
        class="govuk-visually-hidden govuk-accordion__section-heading-divider"
        >,
      </span>
      <span class="govuk-accordion__section-toggle" data-nosnippet
        ><span class="govuk-accordion__section-toggle-focus"
          ><span
            class="govuk-accordion-nav__chevron"
            [class.govuk-accordion-nav__chevron--down]="!expanded()"
          ></span
          ><span class="govuk-accordion__section-toggle-text">{{
            expanded() ? 'Hide' : 'Show'
          }}</span></span
        ></span
      >
    </button>
  </h2>
</div>
<!-- Open the section when the browser's find in page matches its content. -->
<div
  [attr.id]="contentId"
  class="govuk-accordion__section-content"
  [attr.hidden]="expanded() ? null : 'until-found'"
  (beforematch)="expanded.set(true)"
>
  <ng-content></ng-content>
</div>
