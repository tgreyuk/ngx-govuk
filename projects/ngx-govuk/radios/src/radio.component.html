<input
  class="govuk-radios__input"
  [id]="inputId()"
  [name]="group.groupName()"
  type="radio"
  [value]="value()"
  [checked]="checked()"
  [disabled]="isDisabled()"
  [attr.aria-describedby]="hint() ? hintId() : null"
  [attr.aria-controls]="conditional() ? conditionalId() : null"
  [attr.aria-expanded]="conditional() ? checked() : null"
  (change)="group.select(value())"
  (blur)="group.touch()"
/>
<label class="govuk-label govuk-radios__label" [for]="inputId()">
  <ng-content></ng-content>
</label>
@if (hint()) {
  <div [id]="hintId()" class="govuk-hint govuk-radios__hint">{{ hint() }}</div>
}

<ng-template #reveal>
  <div
    class="govuk-radios__conditional"
    [class.govuk-radios__conditional--hidden]="!checked()"
    [id]="conditionalId()"
  >
    <ng-container [ngTemplateOutlet]="conditional()?.template ?? null" />
  </div>
</ng-template>
