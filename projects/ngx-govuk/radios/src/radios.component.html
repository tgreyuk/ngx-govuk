<fieldset class="govuk-fieldset" [attr.aria-describedby]="describedBy()">
  <legend [class]="legendClasses()">
    @if (asPageHeading()) {
      <h1 class="govuk-fieldset__heading">{{ legend() }}</h1>
    } @else {
      <ng-container>{{ legend() }}</ng-container>
    }
  </legend>

  @if (hint()) {
    <div [id]="hintId()" class="govuk-hint">{{ hint() }}</div>
  }

  <ng-content select="[ngxGovukErrorMessage]"></ng-content>

  <div
    class="govuk-radios"
    [class.govuk-radios--inline]="inline()"
    [class.govuk-radios--small]="small()"
  >
    <ng-content></ng-content>
  </div>
</fieldset>
