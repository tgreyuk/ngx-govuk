<div #summary class="govuk-error-summary">
  <!-- GOV.UK keeps role="alert" on a child, so focusing the summary doesn't
       cut short the screen reader announcement. -->
  <div role="alert">
    <h2 class="govuk-error-summary__title">{{ titleText() }}</h2>
    <div class="govuk-error-summary__body">
      @if (description()) {
        <p>{{ description() }}</p>
      }
      @if (errorList().length) {
        <ul class="govuk-list govuk-error-summary__list">
          @for (item of errorList(); track $index) {
            <li>
              @if (item.href) {
                <a
                  [attr.href]="item.href"
                  (click)="focusField($event, item.href)"
                  >{{ item.text }}</a
                >
              } @else {
                {{ item.text }}
              }
            </li>
          }
        </ul>
      }
    </div>
  </div>
</div>
