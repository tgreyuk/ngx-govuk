<h1 class="govuk-heading-xl">Get started</h1>

<p class="govuk-body-l">
  ngx-govuk is a set of Angular components that render GOV.UK Frontend's markup
  and use its styles. You need Angular 22 and GOV.UK Frontend 6.
</p>

<ul class="govuk-list govuk-!-margin-top-6">
  @for (guide of guides; track guide.path) {
    <li>
      <h2 class="govuk-heading-s govuk-!-margin-bottom-1">
        <a class="govuk-link" [routerLink]="guide.path">{{ guide.name }}</a>
      </h2>
      <p class="govuk-body">{{ guide.description }}</p>
    </li>
  }
</ul>
