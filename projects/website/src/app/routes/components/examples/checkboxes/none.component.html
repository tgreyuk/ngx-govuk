<ngx-govuk-checkboxes
  name="countries"
  legend="Will you be travelling to any of these countries?"
  legendSize="l"
  [asPageHeading]="true"
  hint="Select all countries that apply"
>
  <ngx-govuk-checkbox>France</ngx-govuk-checkbox>
  <ngx-govuk-checkbox>Portugal</ngx-govuk-checkbox>
  <ngx-govuk-checkbox>Spain</ngx-govuk-checkbox>
  <div ngxGovukCheckboxesDivider>or</div>
  <ngx-govuk-checkbox exclusive>
    No, I will not be travelling to any of these countries
  </ngx-govuk-checkbox>
</ngx-govuk-checkboxes>
