<ngx-govuk-checkboxes
  name="countries"
  legend="Will you be travelling to any of these countries?"
  asPageHeading
  hint="Select all countries that apply">
  <ngx-govuk-checkbox [formControl]="franceControl">France</ngx-govuk-checkbox>
  <ngx-govuk-checkbox [formControl]="portugalControl">Portugal</ngx-govuk-checkbox>
  <ngx-govuk-checkbox [formControl]="spainControl">Spain</ngx-govuk-checkbox>
  <div ngxGovukCheckboxesDivider>or</div>
  <ngx-govuk-checkbox [formControl]="noneControl" exclusive>
    No, I will not be travelling to any of these countries
  </ngx-govuk-checkbox>
</ngx-govuk-checkboxes>
