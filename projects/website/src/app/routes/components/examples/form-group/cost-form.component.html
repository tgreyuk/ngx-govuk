<form [formGroup]="form" (ngSubmit)="continue()" novalidate>
  <ngx-govuk-form-group
    label="What is the cost per item, in pounds?"
    hint="For example, 4.50"
    labelSize="m"
    prefix="£"
    suffix="per item">
    @if (submitted() && costError(); as error) {
      <p ngxGovukErrorMessage>{{ error }}</p>
    }
    <input
      id="cost"
      type="text"
      inputmode="decimal"
      spellcheck="false"
      formControlName="cost"
      ngxGovukTextInput
      inputWidth="5" />
  </ngx-govuk-form-group>

  <button type="submit" ngxGovukButton>Continue</button>
</form>
