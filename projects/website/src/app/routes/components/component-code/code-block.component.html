<div class="app-code">
  <button
    type="button"
    class="app-code__copy"
    [attr.aria-label]="copied() ? 'Code copied' : 'Copy code'"
    [title]="copied() ? 'Code copied' : 'Copy code'"
    (click)="copy()"
  >
    @if (copied()) {
      <!-- A tick. -->
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M5 12.5l4.5 4.5L19 7.5" />
      </svg>
    } @else {
      <!-- Two overlapping sheets. -->
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
      </svg>
    }
  </button>

  @if (highlighted.value(); as html) {
    <div [innerHTML]="html"></div>
  } @else {
    <!-- Plain text until Shiki has loaded. -->
    <pre [innerText]="code()"></pre>
  }

  <!-- Screen readers don't reliably announce a button's text changing. -->
  <span class="govuk-visually-hidden" aria-live="polite">{{
    copied() ? 'Code copied' : ''
  }}</span>
</div>
