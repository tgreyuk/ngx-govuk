<a href="#main-content" class="app-skip-link" (click)="skipToMain($event, main)"
  >Skip to main content</a
>
<header class="app-header">
  <div class="govuk-width-container app-header__inner">
    <div class="app-header__brand">
      <a routerLink="/" class="app-header__home">
        <img src="/assets/ngx-govuk-logo.svg" alt="" />
        <span class="app-header__name">ngx-govuk</span>
      </a>
      <a
        class="app-header__version"
        href="https://www.npmjs.com/package/ngx-govuk"
        [attr.aria-label]="'ngx-govuk ' + version + ' on npm'"
        ><svg viewBox="0 0 18 7" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M0 0h18v6H9v1H5V6H0zm1 1v4h2V2h1v3h1V1zm5 0v5h2V5h2V1zm2 1h1v2H8zm3-1v4h2V2h1v3h1V2h1v3h1V1z"
          /></svg
        >v{{ version }}</a
      >
    </div>
    <a class="app-header__github" href="https://github.com/tgreyuk/ngx-govuk"
      ><img src="/assets/github-mark-white.png" alt="" /><span
        class="app-header__github-label"
        >GitHub</span
      ></a
    >
  </div>
</header>
<nav class="app-nav" aria-label="Main">
  <div class="govuk-width-container">
    <ul class="app-nav__list">
      <li>
        <a
          class="app-nav__link"
          routerLink="/get-started"
          routerLinkActive="app-nav__link--active"
          ariaCurrentWhenActive="page"
          ><span class="app-nav__label">Get started</span></a
        >
      </li>
      <li>
        <a
          class="app-nav__link"
          routerLink="/components"
          routerLinkActive="app-nav__link--active"
          ariaCurrentWhenActive="page"
          ><span class="app-nav__label">Components</span></a
        >
      </li>
      <li>
        <a
          class="app-nav__link"
          routerLink="/support"
          routerLinkActive="app-nav__link--active"
          ariaCurrentWhenActive="page"
          ><span class="app-nav__label">Help and support</span></a
        >
      </li>
    </ul>
  </div>
</nav>
<div class="app-main">
  <div class="govuk-width-container">
    <main class="govuk-main-wrapper" id="main-content" #main>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
<footer class="app-footer">
  <div class="govuk-width-container">
    <p class="app-footer__text">
      ngx-govuk is a community resource and is not part of the GOV.UK Design
      System.
    </p>
    <p class="app-footer__text">
      Released under the
      <a href="https://github.com/tgreyuk/ngx-govuk/blob/main/LICENSE"
        >MIT licence</a
      >. See the
      <a
        href="https://github.com/tgreyuk/ngx-govuk/blob/main/projects/ngx-govuk/CHANGELOG.md"
        >changelog</a
      >
      for what's new.
    </p>
  </div>
</footer>
